#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "dextryz"
email = "rvs.hello@pm.me"

[signing]
# Sign my own commits with the SSH key GitHub already has
behavior = "own"
backend = "ssh"
key = "~/.ssh/id_ed25519.pub"

[ui]
# Bare `jj` shows the log instead of help
default-command = ["log", "-n", "15"]
diff-editor = ":builtin"
editor = "nvim"
#diff-formatter = ":git"
show-cryptographic-signatures = true
diff-formatter = ["difft", "--color=always", "$left", "$right"]

[template-aliases]
'format_short_id(id)' = 'id.shortest()'
'format_short_commit_id(id)' = 'id.shortest(4)'

[aliases]
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
l = ["log", "-r", "::"]
init = ["git", "init"]
push = ["git", "push"]
fetch = ["git", "fetch"]
# Status with only the A/M/D letter coloured, in bold. jj labels each "M path"
# line as one span, so this ends the styling right after the letter.
st = ["util", "exec", "--", "bash", "-c", '''
set -o pipefail
[ -t 1 ] && color=always || color=never
jj status --color="$color" "$@" |
  sed -E 's/^((\x1b\[[0-9;]*m)+[A-Z?])( .*)\x1b\[[0-9;]*m$/\x1b[1m\1\x1b[0m\3/'
''', "jj-st"]

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'

