# solarized-mono coloring, matching ~/.config/nvim/colors/solarized-mono.lua:
# Solarized base tones plus solarized-osaka accents.
[colors]
# Short unique-prefix of the IDs pops; the rest stays dim
"change_id"          = "#586e75"                          # base01
"change_id prefix"   = { fg = "#9ca0ed", bold = true }    # violet300 (markdown links)
"change_id rest"     = "#586e75"
"commit_id"          = "#586e75"
"commit_id prefix"   = { fg = "#2beede", bold = true }    # cyan300
"commit_id rest"     = "#586e75"

# The columns you scan in `jj log`
"bookmarks"          = { fg = "#d6ffad", bold = false, italic = true }  # green100
"working_copy bookmarks" = "#d6ffad"                      # jj defaults this to bright magenta
"tags"               = "#ffe999"                          # yellow100
"git_head"           = "#2aa298"                          # cyan500
"git_refs"           = "#2aa298"
"author"             = "#839496"                          # base0
"email"              = "#839496"
"timestamp"          = "#586e75"                          # base01

# State markers
"conflict"           = { fg = "#ff9b99", bold = true }    # red100 (errors)
"divergent"          = { fg = "#ff9b99", bold = true }
"empty"              = "#859900"                          # green500
"working_copy"       = { bold = true }                    # the @ line
"working_copy timestamp" = "#586e75"
"description placeholder" = { fg = "#586e75", italic = true }
"working_copy description placeholder" = { fg = "#586e75", italic = true }
"error"              = { fg = "#ff9b99", bold = true }    # red100
"warning"            = "#ffe999"                          # yellow100
"hint"               = "#2aa298"                          # cyan500

# Diffs: same 100 shades as the nvim git signs
"diff added"         = "#d6ffad"                          # green100
"diff modified"      = "#ffe999"                          # yellow100
"diff removed"       = "#ff9b99"                          # red100
"diff renamed"       = "#2aa298"                          # cyan500
"diff copied"        = "#2aa298"
"diff untracked"     = "#586e75"                          # base01
